- name: ParaSwap Subgraphs (GraphQL)
  description: ParaSwap exposes TheGraph subgraphs for historical swap data and limit
    order/RFQ activity across multiple networks. Augustus v5 subgraphs cover standard
    DEX swaps on Ethereum, Arbitrum, Avalanche, Base, BSC, Optimism, and Polygon.
    AugustusRFQ subgraphs provide limit order, P2P, and NFT trade history on Ethereum,
    Arbitrum, Avalanche, BSC, Optimism, and Polygon.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
