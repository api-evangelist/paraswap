apis:
- name: ParaSwap Market API
  description: The Velora Market API provides real-time optimal swap routing across
    170+ DEXes on 12 EVM-compatible chains. Developers can retrieve price quotes with
    optimal routes (GET /prices), build transaction call data (POST /transactions),
    or combine both in a single call (GET /swap). Supports v5 and v6.2 of the Augustus
    smart contract.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.velora.xyz/api/velora-api/velora-market-api
  baseURL: https://api.paraswap.io
  tags:
  - DEX Aggregator
  - Swap Routing
  - Price Quotes
  - Token Swaps
  - EVM
