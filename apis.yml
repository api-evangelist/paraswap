- name: ParaSwap Tokens API
  description: Retrieves the curated list of tokens supported across all ParaSwap-integrated
    networks. Returns token metadata including symbol, contract address, decimals,
    and icon image URL. Supports all 12 active networks via the network path parameter.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.velora.xyz/api/get-tokens-list
