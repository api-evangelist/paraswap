apis:
- name: ParaSwap Delta API
  description: >-
    The Velora Delta API is an intent-based protocol that enables gas-less token swaps where multiple
    agents compete to execute trades on behalf of users. Users sign a Delta Order (EIP-712 off-chain signature)
    rather than making transactions themselves, which provides MEV protection through the Portikus Intents
    network. Currently supports Ethereum and Base networks.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.velora.xyz/api/velora-api/velora-delta-api
  baseURL: https://api.paraswap.io
  tags:
  - Intent-Based Trading
  - Gas-less Swaps
  - MEV Protection
  - EIP-712
  - DeFi
  properties:
  - type: Documentation
    url: https://developers.velora.xyz/api/velora-api/velora-delta-api
  contact:
  - FN: ParaSwap / Velora
    url: https://www.velora.xyz/
    email: ''
  overlays: []
  aid: paraswap:paraswap-delta-api
- name: ParaSwap AugustusRFQ API
  description: >-
    The AugustusRFQ API enables market makers to integrate with ParaSwap's on-chain limit order and Request-for-Quote
    system, supporting fungible token (ERC-20) and NFT trading. Market makers implement a standardized
    HTTP specification for providing token listings, pair data, price curves, and signed firm orders.
    Supports optional HMAC-SHA256 authentication and optional WebSocket streaming for real-time price
    updates.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.velora.xyz/api/augustusrfq
  baseURL: https://api.paraswap.io
