name: ParaSwap
description: ParaSwap (now Velora) is a DEX aggregator that enables dApps and traders
  to get the best swap rates by aggregating liquidity across 170+ DEXes and liquidity
  pools on 12 EVM-compatible chains. The platform offers two core APIs — the Market
  API for optimal route discovery and transaction building, and the Delta API for
  intent-based, gas-less swaps with MEV protection — plus an AugustusRFQ API for market
  makers to provide on-chain limit orders and peer-to-peer trading.
